<main class="settings-page">
  <section class="settings-card">
    <h2>Doctor Settings</h2>
    <p>Use this page to change your password or log out.</p>

    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <input id="currentPassword" type="password" [(ngModel)]="currentPassword" name="currentPassword" placeholder="Enter current password" />
    </div>

    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" />
    </div>

    <button class="btn btn-primary" [disabled]="loading" (click)="onChangePassword()">
      {{ loading ? 'Updating...' : 'Change Password' }}
    </button>

    <button class="btn btn-secondary" (click)="logout()">
      Logout
    </button>

    <div *ngIf="message" class="message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
      {{ message }}
    </div>
  </section>
</main>
